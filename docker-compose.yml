services:
  falkordb:
    image: falkordb/falkordb:v4.22.1
    ports:
      - "127.0.0.1:6379:6379"
      - "127.0.0.1:3000:3000"
    volumes:
      - graph_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Optional: the API and demo page in a container.
  # Start with: docker compose --profile app up -d --build
  api:
    profiles: ["app"]
    build: .
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      FALKORDB_GRAPH: actiongraph
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      falkordb:
        condition: service_healthy

volumes:
  graph_data:
